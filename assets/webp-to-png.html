<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebP → PNG Converter</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e9ef;
    --muted:#8b93a7; --accent:#4f8cff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:32px 16px 80px; background:var(--bg); color:var(--text);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{margin:0 0 24px;color:var(--muted);font-size:14px}

  .drop{
    display:block;border:2px dashed var(--line);border-radius:14px;padding:36px 20px;
    text-align:center;cursor:pointer;background:var(--panel);transition:.15s;
  }
  .drop:hover,.drop.over{border-color:var(--accent);background:#1b2030}
  .drop strong{display:block;font-size:16px;margin-bottom:4px}
  .drop span{color:var(--muted);font-size:13px}
  input[type=file]{display:none}

  .bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:18px 0 8px;display:none}
  .bar.on{display:block}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

  .status{color:var(--muted);font-size:13px;min-height:20px;margin-bottom:16px}

  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  button{
    font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    color:var(--text);padding:9px 16px;cursor:pointer;transition:.15s;
  }
  button:hover:not(:disabled){border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover:not(:disabled){filter:brightness(1.1)}
  button:disabled{opacity:.4;cursor:not-allowed}

  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  li{
    display:flex;align-items:center;gap:14px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:10px 14px;
  }
  li img{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#000;flex:none}
  .info{flex:1;min-width:0}
  .name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{font-size:12px;color:var(--muted);margin-top:2px}
  li.err .meta{color:#ff6b6b}
  a.dl{
    font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--line);
    padding:6px 12px;border-radius:8px;flex:none;
  }
  a.dl:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>WebP → PNG</h1>
  <p class="sub">Everything runs locally in your browser — no files are uploaded anywhere.</p>

  <label class="drop" id="drop">
    <strong>Drop images here</strong>
    <span>or click to choose files (multiple allowed)</span>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </label>

  <div class="bar" id="bar"><i></i></div>
  <div class="status" id="status"></div>

  <div class="toolbar">
    <button class="primary" id="zipBtn" disabled>Download all as ZIP</button>
    <button id="clearBtn" disabled>Clear</button>
  </div>

  <ul id="list"></ul>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
  const drop     = document.getElementById('drop');
  const fileInput= document.getElementById('fileInput');
  const list     = document.getElementById('list');
  const statusEl = document.getElementById('status');
  const bar      = document.getElementById('bar');
  const barFill  = bar.firstElementChild;
  const zipBtn   = document.getElementById('zipBtn');
  const clearBtn = document.getElementById('clearBtn');

  /** Completed conversions: { name, blob, url } */
  const results = [];
  let busy = false;

  /* ---------- drag & drop ---------- */
  ['dragenter','dragover'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); })
  );
  ['dragleave','drop'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); })
  );
  drop.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

  // Stop the browser from navigating when files are dropped outside the zone
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  fileInput.addEventListener('change', e => {
    handleFiles(e.target.files);
    fileInput.value = ''; // allow re-selecting the same files
  });

  /* ---------- conversion ---------- */
  async function convertToPng(file) {
    let bitmap;
    try {
      bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
    } catch {
      bitmap = await loadViaImage(file); // fallback (old Safari, some SVGs)
    }

    const canvas = document.createElement('canvas');
    canvas.width  = bitmap.width;
    canvas.height = bitmap.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bitmap, 0, 0);
    if (bitmap.close) bitmap.close();

    const blob = await new Promise((resolve, reject) =>
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('PNG encoding failed')), 'image/png')
    );
    return { blob, width: canvas.width, height: canvas.height };
  }

  function loadViaImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not decode image')); };
      img.src = url;
    });
  }

  /* ---------- UI helpers ---------- */
  const fmt = n => n < 1024 ? n + ' B'
    : n < 1048576 ? (n / 1024).toFixed(1) + ' KB'
    : (n / 1048576).toFixed(2) + ' MB';

  const toPngName = name => name.replace(/\.[^./\\]+$/, '') + '.png';

  function createRow(fileName) {
    const li = document.createElement('li');
    const img = document.createElement('img');
    img.alt = '';
    const info = document.createElement('div');
    info.className = 'info';
    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = fileName;
    const metaEl = document.createElement('div');
    metaEl.className = 'meta';
    metaEl.textContent = 'Converting…';
    info.append(nameEl, metaEl);
    li.append(img, info);
    list.append(li);
    return { li, img, nameEl, metaEl };
  }

  function updateToolbar() {
    const has = results.length > 0;
    zipBtn.disabled   = !has || busy;
    clearBtn.disabled = (list.children.length === 0) || busy;
  }

  /* ---------- main pipeline ---------- */
  async function handleFiles(fileList) {
    if (busy) return;

    const files = Array.from(fileList).filter(f =>
      f.type.startsWith('image/') || /\.(webp|png|jpe?g|gif|bmp|avif)$/i.test(f.name)
    );
    if (!files.length) return;

    busy = true;
    updateToolbar();
    bar.classList.add('on');

    let done = 0;

    for (const file of files) {
      const row = createRow(file.name);
      statusEl.textContent = `Converting ${done + 1} of ${files.length} — ${file.name}`;

      try {
        const { blob, width, height } = await convertToPng(file);
        const pngName = toPngName(file.name);
        const url = URL.createObjectURL(blob);

        row.img.src = url;
        row.nameEl.textContent = pngName;
        row.metaEl.textContent = `${width}×${height} · ${fmt(file.size)} → ${fmt(blob.size)}`;

        const a = document.createElement('a');
        a.className = 'dl';
        a.href = url;
        a.download = pngName;
        a.textContent = 'Download';
        row.li.append(a);

        results.push({ name: pngName, blob, url });
      } catch (err) {
        row.li.classList.add('err');
        row.metaEl.textContent = 'Failed: ' + (err.message || 'unknown error');
      }

      done++;
      barFill.style.width = (done / files.length * 100) + '%';
      // Yield to the browser so the UI stays responsive on big batches
      await new Promise(r => setTimeout(r, 0));
    }

    bar.classList.remove('on');
    barFill.style.width = '0';
    statusEl.textContent = `Done — ${results.length} PNG${results.length === 1 ? '' : 's'} ready.`;
    busy = false;
    updateToolbar();
  }

  /* ---------- ZIP download ---------- */
  zipBtn.addEventListener('click', async () => {
    if (!window.JSZip) {
      alert('The ZIP library could not be loaded. Use the individual Download buttons instead.');
      return;
    }
    const label = zipBtn.textContent;
    zipBtn.disabled = true;
    zipBtn.textContent = 'Zipping…';

    try {
      const zip = new JSZip();
      const used = new Set();

      for (const r of results) {
        let name = r.name;
        let n = 1;
        while (used.has(name)) {
          name = r.name.replace(/\.png$/i, ` (${n++}).png`);
        }
        used.add(name);
        zip.file(name, r.blob);
      }

      // PNGs are already compressed — STORE keeps it fast
      const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'converted-png.zip';
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (err) {
      alert('ZIP creation failed: ' + err.message);
    } finally {
      zipBtn.textContent = label;
      updateToolbar();
    }
  });

  /* ---------- clear ---------- */
  clearBtn.addEventListener('click', () => {
    results.forEach(r => URL.revokeObjectURL(r.url));
    results.length = 0;
    list.innerHTML = '';
    statusEl.textContent = '';
    updateToolbar();
  });
})();
</script>
</body>
</html>
